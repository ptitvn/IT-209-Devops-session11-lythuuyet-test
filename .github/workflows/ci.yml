name: Java Spring Boot CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Check syntax & Compile
        run: mvn clean compile

      - name: 4. Run Unit Tests
        run: mvn test

      - name: 5. Package JAR application
        run: mvn package -DskipTests

      - name: 6. Upload Build Artifact (.jar)
        uses: actions/upload-artifact@v4
        with:
          name: demo-api-package
          path: target/*.jar
          retention-days: 7
